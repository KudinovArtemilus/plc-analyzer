<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>PLC Analyzer</title>
  <link rel="stylesheet" href="uPlot.min.css">
  <link rel="stylesheet" href="/isa101.css">
  <link rel="stylesheet" href="/access.css">

</head>

<body>
  <h3>PLC Analyzer
    <select id="plcSel"></select>
    <a href="/plcs">ПЛК</a>
    <a href="/signals" id="lnkSignals">Сигналы</a>
    <a href="/history">История</a>
    <a href="/snapshots">Слепки</a>
    <a href="/events" id="lnkEvents">События</a>
  </h3>
  <div id="plcstatus" hx-get="ui/status" hx-vals='js:{plc: PLC_ID}' hx-trigger="load, every 1s">загрузка статуса…</div>
  <div id="recstatus" hx-get="ui/recstatus" hx-vals='js:{plc: PLC_ID}' hx-trigger="load, every 2s"></div>
  <div id="alarms" hx-get="ui/alarms" hx-vals='js:{plc: PLC_ID}' hx-trigger="load, every 1s"></div>
  <div id="shelveForm"></div>

  <div id="toolbar">
    <label title="набор сигналов — «окно графиков»; наборы настраиваются на странице «Наборы»">Набор:
      <select id="setSel">
        <option value="">все сигналы</option>
      </select></label>
    <a href="/sets" id="lnkSets" class="edit" title="создать или изменить наборы">⚙</a>
    Окно:
    <button data-win="60" class="active">1 мин</button>
    <button data-win="120">2 мин</button>
    <button data-win="300">5 мин</button>
    <button data-win="600">10 мин</button>
    <button id="btnStop">⏸ Стоп</button>
    <button id="btnOrder" title="вернуть дорожки в исходный порядок">↺ исходный порядок</button>
    <button id="btnStats" title="мин / макс / среднее и включения битов — между курсорами A–B или на видимом участке">Σ
      Статистика</button>
    <button id="btnAlarms" title="какие аварии и предупреждения показать дорожками" hidden>■ Аварии на графике</button>
    <span id="hint">ЛКМ — курсор A · ПКМ — курсор B · выделение — зум · Esc — убрать курсоры · ⠿ или ▲▼ у имени —
      порядок дорожек · ⊕ — наложить второй сигнал</span>
  </div>
  <div id="alarmPick" class="panel-form" hidden></div>
  <div id="setNote" class="note" hidden></div>
  <div id="statusRow">
    <span id="status">подключение…</span>
    <span id="hoverTime"></span>
  </div>
  <div id="cursors" hidden>
    <span id="cursorText"></span>
    <button id="btnClearCur">✕ убрать курсоры</button>
  </div>
  <div id="stats" hidden></div>
  <div id="lanes"></div>

  <script src="htmx.min.js"></script>
  <script src="isa101.js"></script>
  <script src="uPlot.iife.min.js"></script>
  <script src="lanes.js"></script>
  <script>
    // ПЛК страницы: из адреса /?plc=2, иначе сервер возьмёт первый
    const PLC_ID = new URLSearchParams(location.search).get("plc") || "";
    const plcQ = PLC_ID ? "?plc=" + encodeURIComponent(PLC_ID) : "";
    // Набор сигналов («окно графиков»): /?plc=1&set=3. Нет — все сигналы, как раньше.
    // Набор в адресе — значит, его можно открыть в отдельной вкладке или на другом мониторе
    // и добавить в закладки.
    const SET_ID = new URLSearchParams(location.search).get("set") || "";

    const MAX_S = 600;
    const LANE_H = 80;
    const BIT_H = 44; // дорожка аварийного бита ниже: там только 0 и 1
    const NAME_W = 130;
    let VAL_W = 110; // шире, если есть подписи из справочников (см. main)
    const COLOR_A = ISA.cursorA;
    const COLOR_B = ISA.cursorB;
    const colors = ISA.traces;

    let windowS = 60;
    let paused = false;
    let frozenEnd = 0;
    let curA = null;
    let curB = null;
    let justZoomed = false;
    let configChanged = false;

    const plotWidth = () => window.innerWidth - NAME_W - VAL_W - 40;
    const statusEl = document.getElementById("status");
    const hoverEl = document.getElementById("hoverTime");
    const btnStop = document.getElementById("btnStop");

    function setStatus(text, isPaused) {
      statusEl.textContent = text;
      statusEl.classList.toggle("paused", isPaused);
    }

    document.body.addEventListener("htmx:sendError", () => {
      document.getElementById("plcstatus").innerHTML =
        '<div class="bar bad">● СЕРВЕР НЕДОСТУПЕН — данные на экране не обновляются</div>';
    });

    // ---------- Выбор ПЛК ----------

    async function initPLCs() {
      const list = await (await fetch("api/plcs")).json();
      const sel = document.getElementById("plcSel");
      list.forEach(p => {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = `${p.name} (${p.ip})`;
        sel.appendChild(o);
      });
      const current = PLC_ID || (list[0] ? String(list[0].id) : "");
      sel.value = current;
      document.getElementById("lnkSignals").href = "/signals?plc=" + current;
      document.getElementById("lnkEvents").href = "/events?plc=" + current;
      document.getElementById("lnkSets").href = "/sets?plc=" + current;
      sel.onchange = () => { location.href = "/?plc=" + sel.value; };
      return current; // номер ПЛК — под ним запоминается порядок дорожек
    }

    function nearestIdx(xd, t) {
      if (xd.length === 0) return -1;
      let lo = 0, hi = xd.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (xd[mid] < t) lo = mid + 1; else hi = mid;
      }
      if (lo > 0 && t - xd[lo - 1] < xd[lo] - t) lo--;
      return lo;
    }

    function fmtTime(sec) {
      const d = new Date(sec * 1000);
      return d.toLocaleTimeString("ru-RU", { hour12: false }) + "." +
        String(d.getMilliseconds()).padStart(3, "0");
    }

    function fmtPeriod(ms) {
      return ms >= 1000 ? (ms / 1000) + " с" : ms + " мс";
    }

    // fmtVal — не больше 3 знаков после запятой, иначе REAL не помещается в колонку
    function fmtVal(v) {
      return v == null ? "—" : Number.isInteger(v) ? String(v) : String(+v.toFixed(3));
    }

    // ---------- Выбор набора ----------

    // initSets заполняет выбор наборов и возвращает открытый набор (или null — все сигналы).
    // Наборы не загрузились (старый сервер, ошибка) — работаем как раньше, со всеми сигналами.
    async function initSets(plcKey) {
      let sets = [];
      try { sets = await (await fetch("api/sets" + plcQ)).json(); } catch (e) { }
      const sel = document.getElementById("setSel");
      sets.forEach(s => {
        const o = document.createElement("option");
        o.value = s.id;
        o.textContent = `${s.name} (${s.names.length})`;
        sel.appendChild(o);
      });
      const set = sets.find(s => String(s.id) === SET_ID) || null;
      sel.value = set ? String(set.id) : "";
      // Смена набора — новая страница: состав дорожек задаётся при построении (как и смена ПЛК)
      sel.onchange = () => {
        const q = new URLSearchParams({ plc: plcKey });
        if (sel.value) q.set("set", sel.value);
        location.href = "/?" + q;
      };
      if (set) document.title = set.name + " — PLC Analyzer"; // вкладки различаются по имени
      return { set, missing: SET_ID !== "" && !set };
    }

    async function main() {
      const plcKey = (await initPLCs()) || "default";
      const { set, missing } = await initSets(plcKey);
      // Порядок дорожек и наложения запоминаются отдельно для каждого набора:
      // в «Гидравлике» свой порядок, в «Столе» свой
      const laneKey = set ? plcKey + ":set" + set.id : plcKey;

      const groups = await (await fetch("api/groups" + plcQ)).json();
      // Тексты справочников: {"Step": {"12": "Зажим закрыт"}} — подписи значений (шаги, коды).
      // Не загрузились — не беда: значения покажутся числами, как раньше.
      let texts = {};
      try { texts = await (await fetch("api/dicts" + plcQ)).json(); } catch (e) { }
      if (Object.keys(texts).length) VAL_W = 230; // место под «12 · Зажим закрыт…»

      if (groups.length === 0) {
        setStatus("У этого ПЛК нет включённых сигналов — добавьте их на странице «Сигналы»", false);
      }

      // Живые данные: по группе частоты — общее время gx[g] и значения gy[g][сигнал]
      const gx = groups.map(() => []);
      const gy = groups.map(g => g.names.map(() => []));
      // Что рисуем: в Live — живые массивы, на Стопе — их копия (снимок)
      let view = { x: gx, y: gy };

      // Аварии и предупреждения по умолчанию на графиках не рисуем: они видны на панели аварий
      // (ISA-101 — только когда сработали). Но любую можно вывести дорожкой — выбор запоминается.
      const shownKey = "plca:alarmlanes:" + plcKey;
      let shown = new Set();
      try { shown = new Set(JSON.parse(localStorage.getItem(shownKey) || "[]")); } catch (e) { }

      const laneDefs = [];
      const alarmSignals = []; // все аварии и предупреждения ПЛК — для списка выбора
      // В наборе показываем ровно его сигналы — и скрытые, и аварии: набор — это явный выбор
      const inSet = set ? new Set(set.names) : null;
      groups.forEach((g, gi) =>
        g.names.forEach((name, si) => {
          const kind = (g.kinds && g.kinds[si]) || "trend";
          if (kind !== "trend") alarmSignals.push({ name, kind });
          if (inSet) {
            if (!inSet.has(name)) return;
          } else {
            if (kind === "trend" && g.hidden && g.hidden[si]) return;
            if (kind !== "trend" && !shown.has(name)) return;
          }
          // bool: бит (0/1) или целое число — код ошибки; старый сервер без bits — считаем битом
          const bool = !g.bits || g.bits[si] !== false;
          laneDefs.push({ gi, si, name, kind, bool, periodMs: g.period_ms });
        }));
      // Пояснения про набор — отдельной строкой: строку статуса поток перепишет на «Live»
      const setNote = text => {
        const el = document.getElementById("setNote");
        el.textContent = text;
        el.hidden = false;
      };
      if (missing) {
        setNote("Набора с номером " + SET_ID + " нет — возможно, его удалили. Показаны все сигналы.");
      }
      if (set) {
        // Сигналы набора, которых нет в опросе (выключены) — сказать, а не молча пропустить
        const polled = new Set(laneDefs.map(d => d.name));
        const off = set.names.filter(n => !polled.has(n));
        if (!laneDefs.length) {
          setNote("В наборе «" + set.name + "» нет опрашиваемых сигналов — отметьте их на странице «Наборы».");
        } else if (off.length) {
          setNote("Не опрашиваются (выключены на странице «Сигналы»): " + off.join(", "));
        }
      } else if (groups.length && !laneDefs.length) {
        setStatus("У этого ПЛК только аварии и предупреждения (" + alarmSignals.length +
          ") — их состояние на панели аварий; дорожкой — кнопка «■ Аварии на графике»", false);
      }

      // setShown — показать / убрать аварию дорожкой. Состав дорожек задаётся при построении
      // страницы, поэтому применяем перезагрузкой: поток заново отдаст накопленные 10 минут.
      // На Стопе — при возврате в Live, чтобы не потерять снимок (так же, как при смене сигналов).
      function setShown(name, on) {
        if (on) shown.add(name); else shown.delete(name);
        try { localStorage.setItem(shownKey, JSON.stringify([...shown])); } catch (e) { }
        if (paused) {
          configChanged = true;
          setStatus("СТОП — выбор аварий применится при возврате в Live", true);
        } else {
          location.reload();
        }
      }

      // Список выбора: галочка у каждой аварии и предупреждения
      const btnAlarms = document.getElementById("btnAlarms");
      const pickEl = document.getElementById("alarmPick");
      // В наборе аварии на графике задаёт сам набор — выбор «■ Аварии на графике» не нужен
      if (alarmSignals.length && !set) {
        btnAlarms.hidden = false;
        const n = alarmSignals.filter(a => shown.has(a.name)).length;
        btnAlarms.textContent = "■ Аварии на графике" + (n ? " (" + n + ")" : "");
        btnAlarms.onclick = () => { pickEl.hidden = !pickEl.hidden; };
        alarmSignals.forEach(a => {
          const lb = document.createElement("label");
          lb.className = "pick-item";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = shown.has(a.name);
          cb.onchange = () => setShown(a.name, cb.checked);
          lb.append(cb, " " + (a.kind === "warning" ? "▲ " : "■ ") + a.name);
          pickEl.append(lb);
        });
      }

      // Кнопка «на график» на панели аварий. Панель обновляется раз в секунду, поэтому
      // слушаем щелчки на ней целиком (делегирование), а не на каждой кнопке.
      document.getElementById("alarms").addEventListener("click", e => {
        const btn = e.target.closest("button[data-sig]");
        if (btn) setShown(btn.dataset.sig, true);
      });
      // Уже показанные дорожкой — кнопку прячем: сейчас и после каждого обновления панели
      const markPanel = () => document.querySelectorAll("#alarms button[data-sig]")
        .forEach(b => { b.hidden = !!set || shown.has(b.dataset.sig); });
      markPanel();
      document.body.addEventListener("htmx:afterSwap", e => {
        if (e.detail.target.id === "alarms") markPanel();
      });

      function latestTime() {
        let m = -Infinity;
        gx.forEach(x => { if (x.length) m = Math.max(m, x[x.length - 1]); });
        return m;
      }

      const sync = uPlot.sync("lanes");
      const lanesEl = document.getElementById("lanes");
      const cursorsEl = document.getElementById("cursors");
      const cursorTextEl = document.getElementById("cursorText");
      let lanes = [];
      let axisU = null;    // строка с осью времени под дорожками
      let overlays = null; // наложения второго сигнала на дорожку
      let range = null;    // видимый участок { min, max }

      // setX — один и тот же видимый участок для всех дорожек и оси времени
      function setX(min, max) {
        range = { min, max };
        lanes.forEach(l => l.u.setScale("x", { min, max }));
        if (axisU) axisU.setScale("x", { min, max });
      }

      // ---------- Наложение ----------

      // Наложенная на дорожку l дорожка (или null)
      function ovLane(l) {
        const o = overlays && overlays.get(l.name);
        return o ? lanes.find(x => x.name === o.name) || null : null;
      }

      // Данные для графика: свой ряд или оба ряда на общей оси времени.
      // Сигналы одной группы частоты уже на общем времени — сливать не нужно.
      function laneData(l) {
        const x = view.x[l.gi], y = view.y[l.gi][l.si];
        const o = ovLane(l);
        if (!o) return [x, y];
        const y2 = view.y[o.gi][o.si];
        return o.gi === l.gi ? [x, y, y2] : mergeXY(x, y, view.x[o.gi], y2);
      }

      // ---------- Курсоры ----------

      function drawCursors(u) {
        const ctx = u.ctx;
        const { left, top, width, height } = u.bbox;
        [[curA, COLOR_A], [curB, COLOR_B]].forEach(([t, color]) => {
          if (t == null) return;
          const x = Math.round(u.valToPos(t, "x", true));
          if (x < left || x > left + width) return;
          ctx.save();
          ctx.setLineDash([]); // пунктир наложенной линии не должен достаться курсору
          ctx.strokeStyle = color;
          ctx.lineWidth = 2 * window.devicePixelRatio;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, top + height);
          ctx.stroke();
          ctx.restore();
        });
      }

      // Значение с текстом из справочника, если он есть: «12 · Зажим закрыт»
      function withText(l, v) {
        const t = texts[l.name] && v != null ? texts[l.name][String(v)] : "";
        return fmtVal(v) + (t ? " · " + t : "");
      }

      // Значение сигнала дорожки l в момент t — по его собственным точкам
      function valueAt(l, t) {
        const x = view.x[l.gi], y = view.y[l.gi][l.si];
        const i = nearestIdx(x, t);
        return i < 0 ? "—" : withText(l, y[i]);
      }

      // «12» или «12 / 7.5», если на дорожку наложен второй сигнал
      function valuesAt(l, t) {
        const o = ovLane(l);
        return valueAt(l, t) + (o ? " / " + valueAt(o, t) : "");
      }

      function lastValues(l) {
        const last = l => { const y = view.y[l.gi][l.si]; return y.length ? withText(l, y[y.length - 1]) : "—"; };
        const o = ovLane(l);
        return last(l) + (o ? " / " + last(o) : "");
      }

      function showLaneValues(l) {
        if (!paused) return;
        const parts = [];
        if (curA != null) parts.push("A " + valuesAt(l, curA));
        if (curB != null) parts.push("B " + valuesAt(l, curB));
        const idx = l.u.cursor.idx;
        if (idx != null && l.u.data[0][idx] != null) parts.push("• " + valuesAt(l, l.u.data[0][idx]));
        l.valEl.textContent = parts.length ? parts.join("\n") : lastValues(l);
      }

      function updateCursors() {
        lanes.forEach(l => {
          l.u.redraw(false);
          showLaneValues(l);
        });

        if (curA == null && curB == null) {
          cursorsEl.hidden = true;
          return;
        }
        cursorsEl.hidden = false;
        cursorTextEl.innerHTML = "";
        const add = (cls, text) => {
          const s = document.createElement("span");
          if (cls) s.className = cls;
          s.textContent = text;
          cursorTextEl.append(s, "    ");
        };
        if (curA != null) add("a", "A: " + fmtTime(curA));
        if (curB != null) add("b", "B: " + fmtTime(curB));
        if (curA != null && curB != null) add("", "Δt = " + (curB - curA).toFixed(3) + " с");
        statsChanged();
      }

      function setCursor(which, u, px) {
        if (!paused) setPaused(true);
        const i = nearestIdx(u.data[0], u.posToVal(px, "x"));
        if (i < 0) return;
        const t = u.data[0][i];
        if (which === "A") curA = t; else curB = t;
        updateCursors();
      }

      function clearCursors() {
        curA = curB = null;
        updateCursors();
        statsChanged(); // updateCursors выходит раньше, когда курсоров нет
      }
      document.getElementById("btnClearCur").onclick = clearCursors;
      document.addEventListener("keydown", e => { if (e.key === "Escape") clearCursors(); });

      // ---------- Статистика по участку ----------
      // Участок — как в «Истории»: между курсорами A–B, иначе видимый.
      // Считает сервер по буферу Live. В Live, пока панель открыта, обновляется раз в 2 с.

      const statsEl = document.getElementById("stats");
      let statsOpen = false;
      let statsTimer = null;
      let statsReq = 0;
      let statsLast = 0; // когда последний раз запрашивали (мс)

      function statsRange() {
        if (curA != null && curB != null && curA !== curB) {
          return { from: Math.min(curA, curB), to: Math.max(curA, curB) };
        }
        return range ? { from: range.min, to: range.max } : null;
      }

      async function loadStats() {
        const r = statsRange();
        if (!r) return;
        statsLast = Date.now();
        const no = ++statsReq;
        const q = new URLSearchParams({ from: Math.floor(r.from * 1000), to: Math.ceil(r.to * 1000) });
        if (PLC_ID) q.set("plc", PLC_ID);
        lanes.forEach(l => q.append("s", l.name)); // все дорожки, и наложенные тоже
        const resp = await fetch("ui/live/stats?" + q);
        if (no !== statsReq || !statsOpen) return; // ответ устарел или панель уже закрыли
        // Сервер отдаёт HTML из html/template: имена сигналов уже экранированы
        statsEl.innerHTML = resp.ok ? await resp.text()
          : '<span class="err">ошибка: ' + (await resp.text()).replace(/</g, "&lt;") + "</span>";
        statsEl.hidden = false;
      }

      // Курсор сдвинули или зум — пересчитать через 300 мс после последнего изменения
      function statsChanged() {
        if (!statsOpen) return;
        clearTimeout(statsTimer);
        statsTimer = setTimeout(loadStats, 300);
      }

      function closeStats() {
        statsOpen = false;
        statsEl.hidden = true;
        statsEl.textContent = "";
      }

      document.getElementById("btnStats").onclick = () => {
        if (statsOpen) { closeStats(); return; }
        statsOpen = true;
        loadStats();
      };
      // Крестик приходит вместе с таблицей — слушаем щелчки на панели целиком
      statsEl.addEventListener("click", e => {
        if (e.target.closest(".stats-close")) closeStats();
      });

      // ---------- Зум ----------

      function zoomAll(min, max) {
        if (!paused) setPaused(true);
        setX(min, max);
        statsChanged();
      }

      // ---------- Дорожки ----------

      // makePlot — (пере)создать график дорожки: при построении и когда наложение
      // поменялось (число линий и шкал uPlot задаётся при создании графика)
      function makePlot(l) {
        if (l.u) l.u.destroy();
        const o = ovLane(l);
        const ov = o ? { color: overlayColor(l.idx, o.idx), shared: overlays.get(l.name).shared } : null;

        // Авария: ступенька, закрашено там, где не 0. У бита ось Y — только «0» и «1»;
        // у кода ошибки шкала своя — по значениям кодов
        const isBit = l.kind !== "trend";
        const axes = isaAxes(false, ov && !ov.shared ? ov.color : null);
        let series = laneSeries(colors[l.idx % colors.length], ov);
        if (isBit) {
          if (l.bool) axes[1] = { ...axes[1], splits: () => [0, 1] };
          series[1] = {
            stroke: ISA.alarmLine, width: 1,
            fill: l.kind === "warning" ? ISA.warnFill : ISA.alarmFill,
            paths: uPlot.paths.stepped({ align: 1 }), // держим значение до следующей точки
          };
        }

        const u = new uPlot({
          width: plotWidth(),
          height: l.h,
          scales: isBit && l.bool ? { y: { range: [-0.15, 1.15] } } : {},
          legend: { show: false },
          cursor: {
            sync: { key: sync.key },
            drag: { x: true, y: false, setScale: false },
          },
          hooks: {
            draw: [drawCursors],
            setCursor: [u => {
              showLaneValues(l);
              if (paused && !l.row.hidden) {
                const idx = u.cursor.idx;
                hoverEl.textContent = idx != null
                  ? "курсор мыши: " + fmtTime(u.data[0][idx]) : "";
              }
            }],
            setSelect: [u => {
              if (u.select.width < 5) return;
              justZoomed = true;
              const min = u.posToVal(u.select.left, "x");
              const max = u.posToVal(u.select.left + u.select.width, "x");
              zoomAll(min, max);
              u.setSelect({ left: 0, top: 0, width: 0, height: 0 }, false);
            }],
          },
          // подписи времени — в отдельной строке под дорожками; справа — шкала наложенного сигнала
          axes,
          series,
        }, laneData(l), l.plotEl);

        u.over.addEventListener("click", e => {
          if (justZoomed) { justZoomed = false; return; }
          setCursor("A", u, e.offsetX);
        });
        u.over.addEventListener("contextmenu", e => {
          e.preventDefault();
          setCursor("B", u, e.offsetX);
        });

        l.u = u;
        const line = l.row.querySelector(".name .ovl"); // подпись «+ имя» — цветом пунктира
        if (line && ov) line.style.color = ov.color;
        if (range) u.setScale("x", range);
        l.valEl.textContent = lastValues(l);
        showLaneValues(l);
      }

      lanes = laneDefs.map((d, i) => {
        const row = document.createElement("div");
        const nameEl = document.createElement("div");
        const plotEl = document.createElement("div");
        const valEl = document.createElement("div");
        row.className = "lane";
        row.dataset.name = d.name; // по имени запоминаются порядок дорожек и наложения
        nameEl.className = "name";
        valEl.className = "val";
        valEl.style.width = VAL_W + "px";

        const isBit = d.kind !== "trend";
        const nm = document.createElement("div");
        // \u00a0 — неразрывный пробел: значок не отрывается от имени на отдельную строку
        nm.textContent = (isBit ? (d.kind === "warning" ? "▲\u00a0" : "■\u00a0") : "") + d.name;
        const pr = document.createElement("div");
        pr.className = "period";
        pr.textContent = (isBit ? (d.kind === "warning" ? "предупр. · " : "авария · ") : "") + fmtPeriod(d.periodMs);
        nameEl.append(nm, pr);
        nameEl.title = d.name + " — каждые " + fmtPeriod(d.periodMs);
        if (isBit) row.classList.add("bit");
        if (isBit && !set) { // в наборе дорожку убирают на странице «Наборы»
          const hide = document.createElement("button");
          hide.className = "bit-hide";
          hide.textContent = "✕";
          hide.title = "убрать с графика (останется на панели аварий)";
          hide.onclick = () => setShown(d.name, false);
          pr.append(" ", hide);
        }

        row.append(nameEl, plotEl, valEl);
        lanesEl.appendChild(row);

        return {
          idx: i, gi: d.gi, si: d.si, name: d.name, kind: d.kind, bool: d.bool, h: isBit ? BIT_H : LANE_H,
          row, plotEl, valEl, u: null
        };
      });
      lanes.forEach(makePlot);

      // Ось времени, перестановка дорожек и наложения
      if (lanes.length) {
        axisU = makeTimeAxis(lanesEl, plotWidth());
        const order = makeSortable(lanesEl, laneKey);
        document.getElementById("btnOrder").onclick = () => order.reset();
        overlays = makeOverlays(lanesEl, laneKey, name => {
          const l = lanes.find(x => x.name === name);
          if (l) makePlot(l);
        });
        // Запомненные наложения: теперь overlays есть — перерисовать такие дорожки с двумя линиями
        lanes.filter(l => overlays.get(l.name)).forEach(makePlot);
      }

      // ---------- Live / Стоп ----------

      function redraw() {
        const max = latestTime();
        if (!isFinite(max)) return;
        lanes.forEach(l => {
          if (l.row.hidden) return; // наложенный на другую дорожку — рисуется там
          l.u.setData(laneData(l), false);
          l.valEl.textContent = lastValues(l);
        });
        setX(max - windowS, max);
        // Открытая статистика в Live — раз в 2 с, а не на каждую пачку точек
        if (statsOpen && !paused && Date.now() - statsLast > 2000) loadStats();
      }

      function setPaused(on) {
        paused = on;
        if (on) {
          // Снимок: дальше данные приходят в gx/gy, а экран показывает копию
          view = { x: gx.map(x => x.slice()), y: gy.map(g => g.map(y => y.slice())) };
          frozenEnd = latestTime();
          lanes.forEach(l => l.u.setData(laneData(l), false));
          btnStop.textContent = "▶ Live";
          setStatus("СТОП — экран заморожен, запись продолжается", true);
        } else {
          if (configChanged) {
            location.reload();
            return;
          }
          view = { x: gx, y: gy };
          curA = curB = null;
          cursorsEl.hidden = true;
          hoverEl.textContent = "";
          btnStop.textContent = "⏸ Стоп";
          setStatus("Live", false);
          redraw();
        }
      }
      btnStop.onclick = () => setPaused(!paused);

      document.querySelectorAll("#toolbar button[data-win]").forEach(btn => {
        btn.onclick = () => {
          windowS = Number(btn.dataset.win);
          document.querySelectorAll("#toolbar button[data-win]")
            .forEach(b => b.classList.toggle("active", b === btn));
          if (paused) {
            setX(frozenEnd - windowS, frozenEnd);
            statsChanged();
          } else {
            redraw();
          }
        };
      });

      window.addEventListener("resize", () => {
        lanes.forEach(l => l.u.setSize({ width: plotWidth(), height: l.h }));
        if (axisU) axisU.setSize({ width: plotWidth(), height: 34 });
      });

      // ---------- Поток данных ----------

      const es = new EventSource("api/stream" + plcQ);
      es.onopen = () => { if (!paused && laneDefs.length) setStatus("Live", false); };
      es.onerror = () => { if (!paused) setStatus("нет связи с сервером, переподключение…", false); };

      es.addEventListener("config", () => {
        es.close();
        if (paused) {
          configChanged = true;
          setStatus("СТОП — состав сигналов изменился, нажмите Live для обновления", true);
        } else {
          setStatus("Состав сигналов изменился — обновляю…", false);
          setTimeout(() => location.reload(), 300);
        }
      });

      es.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        const x = gx[msg.g], y = gy[msg.g];
        for (const p of msg.pts) {
          x.push(p.T / 1000);
          p.V.forEach((v, i) => y[i].push(v));
        }
        const cutoff = x[x.length - 1] - MAX_S;
        let k = 0;
        while (k < x.length && x[k] < cutoff) k++;
        if (k > 0) {
          x.splice(0, k);
          y.forEach(arr => arr.splice(0, k));
        }
        if (!paused) redraw();
      };
    }
    main();
  </script>
</body>

</html>
